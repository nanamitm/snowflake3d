name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:   # 手動実行(タグなしでもビルド検証可能)

permissions:
  contents: write

env:
  QT_VERSION: '6.8.1'

jobs:
  # ---------------- Windows (zip) ----------------
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          modules: 'qtquick3d qtshadertools'

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure & build
        run: |
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64 -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR"
          cmake --build build --config Release

      - name: Deploy (windeployqt)
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item build\Release\Snowflake3D.exe dist\
          windeployqt --release --compiler-runtime --qmldir qml dist\Snowflake3D.exe

      - name: Package zip
        run: Compress-Archive -Path dist\* -DestinationPath Snowflake3D-windows-x64.zip

      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: Snowflake3D-windows-x64.zip

  # ---------------- Linux (AppImage) ----------------
  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential ninja-build \
            libgl1-mesa-dev libxkbcommon-dev libvulkan-dev \
            libxcb-cursor0 libfuse2

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: linux
          target: desktop
          arch: linux_gcc_64
          modules: 'qtquick3d qtshadertools'

      - name: Configure & build
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR"
          cmake --build build

      - name: Build AppImage
        run: |
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          wget -q https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
          chmod +x linuxdeploy*.AppImage
          export APPIMAGE_EXTRACT_AND_RUN=1
          export QML_SOURCES_PATHS="$PWD/qml"
          export QMAKE="$QT_ROOT_DIR/bin/qmake"
          ./linuxdeploy-x86_64.AppImage \
            --appdir AppDir \
            -e build/Snowflake3D \
            -d packaging/Snowflake3D.desktop \
            -i packaging/Snowflake3D.png \
            --plugin qt \
            --output appimage
          # 出力(Snowflake...)だけをリネーム(ツールの linuxdeploy*.AppImage は除外)
          mv Snowflake*.AppImage Snowflake3D-linux-x86_64.AppImage

      - uses: actions/upload-artifact@v7
        with:
          name: linux
          path: Snowflake3D-linux-x86_64.AppImage

  # ---------------- Release (tag のときだけ) ----------------
  release:
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v8

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            windows/Snowflake3D-windows-x64.zip
            linux/Snowflake3D-linux-x86_64.AppImage
          generate_release_notes: true
